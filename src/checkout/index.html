<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Outside | Checkout</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script type="module" src="../js/Checkout.js"></script>
</head>

<body>
  <header class="divider" id="main-header"></header>

  <main class="divider checkout main-checkout">
  <h2>Review & Place your Order</h2>
  <section class="checkout-form">
    <form name="checkout">
      <fieldset>
        <legend>Shipping</legend>

        <div class="checkout__name">
          <label>
            First Name
            <input type="text" name="fname" id="fname" required />
          </label>
          <label>
            Last Name
            <input type="text" name="lname" id="lname" required />
          </label>
        </div>

        <div class="checkout__address">
          <label>
            Address
            <input type="text" name="address" id="address" required />
          </label>
          <label>
            City
            <input type="text" name="city" id="city" required />
          </label>
          <label>
            State
            <input type="text" name="state" id="state" required />
          </label>
          <label>
            Zip
            <input type="text" name="zip" id="zip" required />
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Payment</legend>

        <div class="checkout__payment">
          <label>
            Card Number
            <input type="text" name="cardNumber" id="cardNumber" required />
          </label>
          <label>
            Expiration
            <input type="text" name="exp" id="exp" required />
          </label>
          <label>
            CVV
            <input type="text" name="cvv" id="cvv" required />
          </label>
        </div>
      </fieldset>

      <fieldset class="checkout-summary">
        <legend>Order Summary</legend>

        <div class="checkout-summary">
          <div>Items</div>
          <div id="numberItems">0</div>
          <div>Subtotal</div>
          <div id="cartTotal">0</div>
          <div>Shipping</div>
          <div id="shipping">0</div>
          <div>Tax</div>
          <div id="tax">0</div>
          <div>Total</div>
          <div id="total"></div>
        </div>
      </fieldset>

      <button type="submit" id="checkoutSubmit">Checkout</button>
    </form>
  </section>
</main>


  <footer id="main-footer"></footer>
</body>

</html>
